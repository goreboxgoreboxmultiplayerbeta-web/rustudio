name: Build Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK and NDK
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Cargo NDK
        run: cargo install cargo-ndk --locked

      - name: Compile RuStudio Android
        run: |
          cargo ndk -t arm64-v8a -p 26 build \
            --package rustudio --lib

      - name: Upload Android Library
        uses: actions/upload-artifact@v4
        with:
          name: RuStudio-ARM64
          path: target/aarch64-linux-android/debug/librustudio.so
          if-no-files-found: error
